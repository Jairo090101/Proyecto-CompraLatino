<article class="kpi">
  <div class="kpi__top">
    <h2>{{ label() }}</h2>
    @if (icon()) {
      <span class="kpi__icon" aria-hidden="true">
        @switch (icon()) {
          @case ('coin') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="7" ry="3" /><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" /></svg>
          }
          @case ('users') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="3" /><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></svg>
          }
          @case ('box') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" /><path d="M3.3 7 12 12l8.7-5M12 22V12" /></svg>
          }
          @case ('chart') {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18" /><path d="m7 14 4-4 3 3 5-6" /></svg>
          }
        }
      </span>
    }
  </div>
  <p class="kpi__value" [class]="'kpi__value kpi__value--' + tone()">{{ value() }}</p>
  @if (hint()) {
    <p class="kpi__hint">{{ hint() }}</p>
  }
  @if (trend()) {
    <p class="kpi__trend" [class.kpi__trend--down]="!trendUp()">{{ trendUp() ? '▲' : '▼' }} {{ trend() }}</p>
  }
</article>
