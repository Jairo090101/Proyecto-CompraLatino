<main class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Ingresar</h1>
    <p>Accede a tu cuenta de CompraLatino.</p>
    @if (error) { <div class="error">{{ error }}</div> }
    <label>Correo<input type="email" formControlName="email" autocomplete="email"></label>
    <label>Contraseña<input type="password" formControlName="password" autocomplete="current-password"></label>
    <button class="btn btn-primary" type="submit">Ingresar</button>
    <a routerLink="/registro">Crear una cuenta</a>
  </form>
</main>
