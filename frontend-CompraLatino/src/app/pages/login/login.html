<section class="login">
  <form class="login__card" (submit)="onSubmit($event)" novalidate>
    <p class="eyebrow">Cuenta</p>
    <h1 class="login__title">Ingresar</h1>
    <p class="login__hint">Usa el correo y la contraseña de tu cuenta.</p>

    <label class="login__field">
      <span>Correo</span>
      <input class="form-control" type="email" name="email" autocomplete="username" placeholder="tu@correo.com" required />
    </label>

    <label class="login__field">
      <span>Contraseña</span>
      <input class="form-control" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
    </label>

    @if (error()) {
      <p class="login__error" role="alert">{{ error() }}</p>
    }

    <button class="btn btn-primary btn-block login__submit" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</section>
