<main class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Crear cuenta</h1>
    <p>Regístrate para guardar tus compras y recomendaciones.</p>
    @if (error) { <div class="error">{{ error }}</div> }
    <label>Nombre<input formControlName="name" autocomplete="name"></label>
    <label>Correo<input type="email" formControlName="email" autocomplete="email"></label>
    <label>Contraseña<input type="password" formControlName="password" autocomplete="new-password"></label>
    <label>Confirmar contraseña<input type="password" formControlName="password_confirmation" autocomplete="new-password"></label>
    <button class="btn btn-primary" type="submit">Registrarme</button>
    <a routerLink="/login">Ya tengo una cuenta</a>
  </form>
</main>
