<section class="hero">
  <div class="container hero__content">
    <span class="hero__pill">
      <span class="hero__dot" aria-hidden="true"></span>
      Importaciones directas desde Japón
    </span>

    <h1 class="hero__title">Lo mejor de <span class="text-primary">Japón</span>, en tu país.</h1>

    <p class="hero__subtitle">
      Compramos por ti directamente en Yahoo Auctions Japan. Electrónica, coleccionables, moda y más
      &mdash; entregado a tu puerta en Latinoamérica.
    </p>

    <form class="hero__search" role="search" (ngSubmit)="onSubmit()">
      <label class="visually-hidden" for="hero-search-input">Buscar productos</label>
      <svg class="hero__search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input
        id="hero-search-input"
        type="search"
        name="term"
        placeholder="ej. Sony, Nintendo, Toyota, Gundam..."
        autocomplete="off"
        [ngModel]="term()"
        (ngModelChange)="term.set($event)"
      />
      <button type="submit" class="btn btn-primary">Buscar</button>
    </form>

    <ul class="hero__stats">
      @for (stat of stats(); track stat.label) {
        <li>
          <strong>{{ stat.value }}</strong>
          <span>{{ stat.label }}</span>
        </li>
      }
    </ul>
  </div>
</section>
