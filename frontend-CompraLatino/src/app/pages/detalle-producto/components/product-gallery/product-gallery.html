<div class="gallery">
  <div class="gallery__main">
    <img appImgFallback [src]="selected()" [alt]="alt()" />
  </div>

  @if (images().length > 1) {
    <div class="gallery__thumbs" role="group" aria-label="Imágenes del producto">
      @for (image of images(); track image; let i = $index) {
        <button
          type="button"
          class="gallery__thumb"
          [class.gallery__thumb--active]="i === selectedIndex()"
          [attr.aria-label]="'Ver imagen ' + (i + 1)"
          [attr.aria-pressed]="i === selectedIndex()"
          (click)="select(i)"
        >
          <img appImgFallback [src]="image" alt="" loading="lazy" />
        </button>
      }
    </div>
  }
</div>
